<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maintenance — Le Chat Noir</title>
    <meta name="description" content="Le site du Chat Noir est momentanément en maintenance. L'antenne continue et le flux reste écoutable." />
    <meta name="theme-color" content="#ece4d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161310" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <script type="module">
      import { REFRESH_MS } from "./assets/js/config.js";
      import { fetchNowPlaying, fetchCurrentShow, STATUS } from "./assets/js/radio-api.js";
      import { createPoller } from "./assets/js/poller.js";
      import { setTextIfChanged } from "./assets/js/ui-states.js";

      async function refresh() {
        const [showResult, trackResult] = await Promise.all([fetchCurrentShow(), fetchNowPlaying()]);
        if (showResult.status === STATUS.OK) {
          setTextIfChanged(document.getElementById("mShow"), showResult.data.show || "Programmation en cours");
        }
        if (trackResult.status === STATUS.OK) {
          const t = trackResult.data;
          setTextIfChanged(document.getElementById("mTrack"), [t.artist, t.title].filter(Boolean).join(" — ") || "—");
        }
        return showResult.status === STATUS.OK || trackResult.status === STATUS.OK;
      }
      createPoller(refresh, REFRESH_MS.live).start();
    </script>
  </head>
  <body>
    <main class="site-main" style="max-width: 560px; padding-top: 56px;">
      <img src="assets/media/brand/logo-320.jpg" alt="" width="56" height="56" style="border-radius: 50%;" />
      <p class="kicker kicker--accent" style="margin: 18px 0 6px;">// maintenance en cours</p>
      <h1 class="page-title">Le Chat Noir</h1>
      <p class="page-lead" style="margin-bottom: 24px;">
        Le site est momentanément en maintenance. L'antenne, elle, continue : vous pouvez écouter le direct
        ci-dessous.
      </p>

      <div class="contrib-card">
        <span class="kicker">à l'antenne</span>
        <p style="font-size: 17px; font-weight: 650; margin: 4px 0 2px;" id="mShow">Chargement…</p>
        <p class="status-line" id="mTrack">…</p>
        <audio controls preload="none" style="width: 100%; margin-top: 14px;">
          <source src="https://stream.lechatnoirradio.fr/stream.mp3" type="audio/mpeg" />
        </audio>
      </div>
    </main>
  </body>
</html>
